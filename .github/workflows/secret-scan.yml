name: secret-scan

# The local pre-commit hook is the real control: it stops a secret before the
# commit exists, which is the only moment that costs nothing. This job is the
# backstop for the case the hook was not installed on some machine, and it
# scans full history rather than one diff.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # Monday, so a leak cannot sit unnoticed for a week
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # whole history: a secret removed in a later commit is still leaked

      # The gitleaks binary is free. The official Action is not, for
      # organization repositories, so it is not used here: a security control
      # that depends on a licence is a control that lapses.
      - name: Install gitleaks
        run: |
          VERSION=8.30.1
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks detect --no-banner --redact --exit-code 1 -c .gitleaks.toml -v

  house-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: English only, no em dashes
        shell: bash
        run: |
          # No pipefail and no bare grep exit codes driving the step: a check
          # that fails when it finds nothing is worse than no check at all.
          em=$(printf '\xe2\x80\x94')
          tr_chars=$(printf '\xc3\xa7\xc4\x9f\xc4\xb1\xc3\xb6\xc5\x9f\xc3\xbc\xc3\x87\xc4\x9e\xc4\xb0\xc3\x96\xc5\x9e\xc3\x9c')
          # -I keeps binary files out of a text style check.
          bad=0
          while IFS= read -r f; do
            case "$f" in githooks/*) continue ;; esac    # the guard holds what it hunts
            [ -f "$f" ] || continue
            if LC_ALL=C grep -Iq "$em" "$f" 2>/dev/null; then
              echo "::error file=$f::em dash"; bad=1
            fi
            if LC_ALL=C grep -Iq "[$tr_chars]" "$f" 2>/dev/null; then
              echo "::error file=$f::non-English characters"; bad=1
            fi
          done < <(git ls-files)
          [ "$bad" -eq 0 ] && echo "house style clean"
          exit "$bad"
