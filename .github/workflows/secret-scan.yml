name: secret-scan

# The local pre-commit hook is the real control: it stops a secret before the
# commit exists, which is the only moment that costs nothing. This job is the
# backstop for the case the hook was not installed on some machine, and it
# scans full history rather than one diff.

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # Monday, so a leak cannot sit unnoticed for a week
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # whole history: a secret removed in a later commit is still leaked

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  house-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: English only, no em dashes
        run: |
          # The hooks are exempt from this: they contain the characters they hunt.
          files=$(git ls-files | grep -v '^githooks/' || true)
          [ -z "$files" ] && exit 0
          if echo "$files" | xargs grep -l "$(printf '\xe2\x80\x94')" 2>/dev/null | grep .; then
            echo "::error::em dash found in the files listed above"
            exit 1
          fi
          if echo "$files" | xargs grep -lP '[\x{00e7}\x{011f}\x{0131}\x{00f6}\x{015f}\x{00fc}\x{00c7}\x{011e}\x{0130}\x{00d6}\x{015e}\x{00dc}]' 2>/dev/null | grep .; then
            echo "::error::non-English characters found in the files listed above"
            exit 1
          fi
          echo "house style clean"
